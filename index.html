// Care Plus A / K (brackets 0-17,18-24,25-35,36-45,46-50,51-55,56-60,61-65,66-70,71-75,76-85)

function fill(){var c=$('cnt');for(var n=1;n<=8;n++){var o=document.createElement('option');o.value=n;o.textContent=n;c.appendChild(o)}c.value=2}

for(var i=0;i<n;i++)h+='<div class="m"><label>Person '+(i+1)+' – age</label><input type="number" min="0" max="85" data-a="'+i+'" value="'+ages[i]+'"></div>';

[].forEach.call($('mem').querySelectorAll('[data-a]'),function(e){e.oninput=function(){ages[+e.dataset.a]=e.value===''?NaN:+e.value;calc()}});}

var key=t=='J'?'J':t=='I'?'I':(n>=4?4:n);var tab=D[net][key];var rows=[0,0,0],am85=0,am100=0,comp=0,br=[],young=true;

if(a>45)young=false;var r,idx=0;if(t=='J')r=tab;else{idx=bi(a,B);r=tab[idx]}
for(var c=0;c<3;c++)rows[c]+=r[c];
